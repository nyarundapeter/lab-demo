    atomic_class: control
    contract: openapi
    status: beta
  - id: PS.NOTIF
    name: Notifications
    atomic_class: integration
    contract: openapi
    status: beta
  - id: PS.SEARCH
    name: Search
    atomic_class: integration
    contract: openapi
    status: beta
  - id: PS.WORKFLOW
    name: Workflow Engine
    atomic_class: app
    contract: openapi
    status: beta
  - id: PS.EVENTS
    name: Event Bus
    atomic_class: integration
    contract: asyncapi
    status: beta
  - id: PS.AI
    name: AI Service
    atomic_class: ai
