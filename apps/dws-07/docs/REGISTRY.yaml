# REGISTRY.yaml — DBP Blueprint Library Master Index
# The scaffold generator reads this. It is the machine-readable source of truth for
# every stack layer, platform service, shell, feature, and catalog solution.
# Naming follows L00-L05. Status: stable | beta | planned.

version: 1.3.0
blueprint_version: platform/v1.5.0

# ─────────────────────────────────────────────────────────────────────────────
# THE 10-LAYER STACK (the spine). build_mode: once = platform-built & consumed;
# per_solution = scaffolded each time.
# ─────────────────────────────────────────────────────────────────────────────
stack:
  - layer: 1
    id: standards
    name: Standards & Reference Architecture as Code
    build_mode: once
    owner: SDO.01
  - layer: 2
    id: infra
    name: Infrastructure as Code
    build_mode: once
    owner: SDO.02
  - layer: 3
    id: environment
    name: Environment as Code
    build_mode: once
    owner: SDO.02
  - layer: 4
    id: pipeline
    name: Pipeline as Code
    build_mode: once
    owner: SDO.02
  - layer: 5
    id: policy
    name: Policy / Security / Compliance as Code
    build_mode: once
    owner: SDO.01
  - layer: 6
    id: platform-services
    name: Platform Services as Code
    build_mode: once
    owner: SDO.02
    note: The 10 services below. Built once, wired by ID. NEVER per-solution.
  - layer: 7
    id: app-scaffolds
    name: Application Scaffolds as Code
    build_mode: per_solution
    owner: SDO.02
    note: Shells + feature blueprints. The plug-and-play layer.
  - layer: 8
    id: observability
    name: Observability as Code
    build_mode: once
    owner: SDO.03
  - layer: 9
    id: ai-engineering
    name: AI-Assisted Engineering as Code
    build_mode: once
    owner: SDO.02
  - layer: 10
    id: provisioning
    name: Provisioning as Code
    build_mode: once
    owner: SDO.02

# ─────────────────────────────────────────────────────────────────────────────
