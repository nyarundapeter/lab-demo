# Thin presentational bindings — render a PS.* directly, NOT standalone features.
# Live in shared/ui, not the feature catalogue.
# NOTE (2026-07-21): ActivityFeed, AssistantPanel, TenantSwitcher were promoted
# to organisms (APP.F14/F16/F17 above) per the Bindings/Admin resolution in
# wave3-build-plan.md — they owned real fetch/mutation state, so they were
# mis-filed here. NotificationBell and SearchBar remain here (blocked on an
# AppChrome layer-boundary conflict — see wave3-build-plan.md "AppChrome
# default-wiring conflict" note); PermissionGate stays, confirmed stateless.
bindings:
  - { id: NotificationBell, renders: PS.NOTIF, mounts: [all] }
  - { id: SearchBar,       renders: PS.SEARCH, mounts: [SH.01, SH.02] }
  - { id: PermissionGate,  renders: PS.RBAC,   mounts: [any] }

