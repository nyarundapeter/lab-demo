# ─────────────────────────────────────────────────────────────────────────────
# PLATFORM DATA — durable backing for the 10 Layer-06 services.
# build_mode: once (the schema is fixed); applied per_solution as the FIRST
# migration when a new solution DB is provisioned. See
# docs/01-architecture/02-data-identity/data-architecture.md and ADR-0016/0017/0018/0039.
# ─────────────────────────────────────────────────────────────────────────────
persistence:
  package: "@dbp/platform-db"
  path: packages/stack/platform-db
  substrate: postgres            # Supabase-first, Azure-portable (vanilla PG 16)
  tooling: drizzle               # drizzle-orm + drizzle-kit; postgres.js driver
  tenancy: pooled-rls            # one DB per solution; RLS on tenant_id; pooled→bridge→silo
  entity_model: two-mode         # prototype: JSONB entity plane (PS.DATA, ADR-0018, demo-only) |
                                 # production: relational domain schemas (discovery/workspace/operations,
                                 # ADR-0039), selected per-solution via manifest `data_model: prototype|relational`
  status: beta
  baseline_migrations:           # applied in order to a fresh DB — the "first migration"
    - migrations/0000_platform_init.sql   # extensions, 11 schemas, 22 tables, indexes, triggers
    - migrations/0001_platform_rls.sql    # roles, RLS, 14 tenant_isolation policies, grants
    - migrations/0002_seed.sql            # tenant-alpha, roles, permissions, matrix (idempotent)
  schemas:                       # one Postgres schema per service + shared platform
    platform: shared (GUC helpers, extensions)
    auth: PS.AUTH
    rbac: PS.RBAC
    audit: PS.AUDIT
    notif: PS.NOTIF
    search: PS.SEARCH
    workflow: PS.WORKFLOW
    events: PS.EVENTS
    ai: PS.AI
    data: PS.DATA
    apigw: PS.APIGW

# ─────────────────────────────────────────────────────────────────────────────
# LAYER 07 — STAGE SHELLS
# Phase 2 consolidation: two canonical shell ids replace the old five.
#   SH.PUBLIC    = public shell (landing / login / public pages)
#   SH.WORKSPACE = transaction shell (AppChrome + 3-level nav + SessionGuard)
# Legacy ids SH.00–SH.04 are kept below for back-compat; the generator maps
# them via SHELL_ALIAS (SH.00→SH.PUBLIC, SH.01–04→SH.WORKSPACE).
# ─────────────────────────────────────────────────────────────────────────────
shells:
  # ── Canonical two-shell model (Phase 2) ──────────────────────────────────
  - id: SH.PUBLIC
    name: Public Shell
    journey_role: Discover/Select
    app_type: web
    component: LandingShell
    package: "@dbp/shell-landing"
    composes: [PS.DATA]
    slots: [hero, features, proof, cta, footer]
    status: beta
    note: No SessionGuard. Used for landing pages, login, and public-facing routes.
  - id: SH.WORKSPACE
    name: Workspace Shell
    journey_role: Transact/Deliver/Process
    app_type: transact
    component: TransactionShell
    package: "@dbp/shell-transaction"
    composes: [PS.AUTH, PS.WORKFLOW, PS.DATA, PS.NOTIF]
    slots: [main, context]
    status: beta
    note: AppChrome top bar + persistent 3-level nav sidebar + SessionGuard.
  # ── Legacy shell ids (deprecated — kept for back-compat) ─────────────────
  # New manifests should use SH.PUBLIC or SH.WORKSPACE.
  # The generator resolves these via SHELL_ALIAS before any component lookup.
  - id: SH.00
    name: Landing Shell
    journey_stage: 0
    journey_role: Discover
    app_type: web
    composes: [PS.DATA, PS.AI]
    status: beta
    deprecated: true
    superseded_by: SH.PUBLIC
  - id: SH.01
    name: Marketplace Shell
    journey_stage: 1
    journey_role: Select
    app_type: web
    composes: [PS.SEARCH, PS.AI, PS.DATA]
    status: beta
    deprecated: true
    superseded_by: SH.WORKSPACE
  - id: SH.02
    name: Transaction Workspace Shell
    journey_stage: 2
    journey_role: Transact
    app_type: transact
    composes: [PS.AUTH, PS.WORKFLOW, PS.DATA, PS.NOTIF]
    status: beta
    deprecated: true
    superseded_by: SH.WORKSPACE
  - id: SH.03
    name: Delivery/Admin Master-Detail Shell
    journey_stage: 3
    journey_role: Deliver
    app_type: transact
    composes: [PS.WORKFLOW, PS.RBAC, PS.AUDIT, PS.NOTIF, PS.DATA]
    status: beta
    deprecated: true
    superseded_by: SH.WORKSPACE
  - id: SH.04
    name: Specialist Workbench Shell
    journey_stage: 4
    journey_role: Process
    app_type: transact
    composes: [PS.AI, PS.DATA, PS.AUDIT]
    status: beta
    deprecated: true
    superseded_by: SH.WORKSPACE
  - id: SH.WS
    name: Workspace Shell (legacy alias)
    journey_stage: 2
    journey_role: Transact
    app_type: transact
    composes: [PS.AUTH, PS.WORKFLOW, PS.DATA, PS.NOTIF]
    package: "@dbp/shell-workspace"
    status: beta
    deprecated: true
    superseded_by: SH.WORKSPACE
    note: Legacy id declared by @dbp/shell-workspace (thin re-export of SH.WORKSPACE).

